<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Editor</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Snap.svg CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/snap.svg/0.5.1/snap.svg-min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>SVG Editor</h1>
        </header>

        <!-- Toolbar -->
        <div id="toolbar">
            <div class="toolbar-section">
                <h3>Tools</h3>
                <div class="tool-buttons">
                    <button id="tool-select" class="tool-btn active" data-tool="select" title="Select/Drag">
                        <span>↖</span> Select
                    </button>
                    <button id="tool-line" class="tool-btn" data-tool="line" title="Draw Line">
                        <span>/</span> Line
                    </button>
                    <button id="tool-circle" class="tool-btn" data-tool="circle" title="Draw Circle">
                        <span>○</span> Circle
                    </button>
                    <button id="tool-rect" class="tool-btn" data-tool="rect" title="Draw Rectangle">
                        <span>□</span> Rectangle
                    </button>
                    <button id="tool-scribble" class="tool-btn" data-tool="scribble" title="Freehand Draw">
                        <span>∿</span> Scribble
                    </button>
                    <button id="tool-delete" class="tool-btn" data-tool="delete" title="Delete Shape">
                        <span>✕</span> Delete
                    </button>
                </div>
            </div>

            <div class="toolbar-section">
                <h3>Properties</h3>
                <div class="properties">
                    <div class="property">
                        <label for="stroke-color">Color:</label>
                        <input type="color" id="stroke-color" value="#000000">
                    </div>
                    <div class="property">
                        <label for="stroke-width">Width:</label>
                        <input type="number" id="stroke-width" min="1" max="50" value="2">
                    </div>
                </div>
            </div>

            <div class="toolbar-section">
                <h3>File</h3>
                <div class="file-buttons">
                    <button id="import-svg" class="action-btn">
                        📁 Import SVG
                    </button>
                    <input type="file" id="file-input" accept=".svg" style="display: none;">
                    <button id="clear-canvas" class="action-btn danger">
                        🗑 Clear Canvas
                    </button>
                </div>
            </div>
        </div>

        <!-- Canvas Area -->
        <div id="canvas-container">
            <svg id="svg-canvas"></svg>
        </div>

        <!-- Status Bar -->
        <div id="status-bar">
            <span id="status-text">Ready</span>
            <span id="cursor-position"></span>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="js/shapes.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
