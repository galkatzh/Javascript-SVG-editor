<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Editor</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Snap.svg CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/snap.svg/0.5.1/snap.svg-min.js"></script>
</head>
<body>
    <div class="app">
        <!-- Canvas Area (main workspace) -->
        <div id="canvas-container">
            <svg id="svg-canvas"></svg>
        </div>

        <!-- Floating Tools Panel (Left) -->
        <div id="tools-panel" class="floating-panel">
            <button id="tool-select" class="tool-btn active" data-tool="select" title="Select & Move (V)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
                    <path d="M13 13l6 6"/>
                </svg>
            </button>
            <button id="tool-line" class="tool-btn" data-tool="line" title="Line Tool (L)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="19" x2="19" y2="5"/>
                </svg>
            </button>
            <button id="tool-circle" class="tool-btn" data-tool="circle" title="Circle Tool (C)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="9"/>
                </svg>
            </button>
            <button id="tool-rect" class="tool-btn" data-tool="rect" title="Rectangle Tool (R)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="4" width="16" height="16" rx="1"/>
                </svg>
            </button>
            <button id="tool-scribble" class="tool-btn" data-tool="scribble" title="Freehand Draw (P)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                    <path d="M2 2l7.586 7.586"/>
                </svg>
            </button>
            <div class="tool-divider"></div>
            <button id="tool-delete" class="tool-btn danger" data-tool="delete" title="Delete Tool (X)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18"/>
                    <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/>
                    <path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                </svg>
            </button>
        </div>

        <!-- Floating Properties Panel (Bottom Right) -->
        <div id="properties-panel" class="floating-panel">
            <!-- Shown only while editing multiple shapes at once -->
            <div id="batch-note" class="batch-note" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="8" width="13" height="13" rx="2"/>
                    <path d="M8 8V5a2 2 0 012-2h9a2 2 0 012 2v9a2 2 0 01-2 2h-3"/>
                </svg>
                <span id="batch-note-text">Batch editing</span>
            </div>
            <div class="prop-group">
                <div class="color-input-wrap" title="Stroke Color">
                    <input type="color" id="stroke-color" value="#000000">
                    <svg class="color-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="9" stroke-dasharray="4 2"/>
                    </svg>
                </div>
                <div class="expandable-slider" id="stroke-width-widget" title="Stroke Width">
                    <div class="slider-trigger">
                        <svg class="slider-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="4" y1="12" x2="20" y2="12" stroke-width="3"/>
                        </svg>
                        <span class="slider-value" id="stroke-width-value">2</span>
                    </div>
                    <div class="slider-panel">
                        <input type="range" id="stroke-width" min="1" max="50" value="2">
                    </div>
                </div>
            </div>
            <div class="prop-group">
                <div class="color-input-wrap fill-color-wrap" title="Fill Color">
                    <input type="color" id="fill-color" value="#ffffff">
                    <svg class="color-icon" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="8"/>
                    </svg>
                </div>
                <label class="checkbox-wrap" title="Transparent Fill">
                    <input type="checkbox" id="fill-transparent" checked>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M3 3l18 18"/>
                    </svg>
                </label>
            </div>
            <div class="prop-group">
                <div class="expandable-slider" id="opacity-widget" title="Opacity">
                    <div class="slider-trigger">
                        <svg class="slider-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="9" opacity="0.5"/>
                        </svg>
                        <span class="slider-value" id="opacity-value">100</span>
                    </div>
                    <div class="slider-panel">
                        <input type="range" id="shape-opacity" min="0" max="100" value="100">
                    </div>
                </div>
            </div>
        </div>

        <!-- Floating File Actions Panel (Top Right) -->
        <div id="file-panel" class="floating-panel">
            <button id="import-svg" class="action-btn" title="Import SVG">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="17,8 12,3 7,8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </button>
            <input type="file" id="file-input" accept=".svg" style="display: none;">
            <button id="export-svg" class="action-btn" title="Export SVG">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="7,10 12,15 17,10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
            </button>
            <button id="clear-canvas" class="action-btn danger" title="Clear Canvas">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18"/>
                    <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/>
                    <path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                    <line x1="10" y1="11" x2="10" y2="17"/>
                    <line x1="14" y1="11" x2="14" y2="17"/>
                </svg>
            </button>
        </div>

        <!-- Canvas Size Controls (Top Left) -->
        <div id="canvas-panel" class="floating-panel">
            <div class="canvas-size-group" title="Canvas Size">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M9 3v18M3 9h18"/>
                </svg>
                <input type="number" id="canvas-width" min="100" max="5000" placeholder="W">
                <span class="size-separator">×</span>
                <input type="number" id="canvas-height" min="100" max="5000" placeholder="H">
            </div>
        </div>

        <!-- Status Bar -->
        <div id="status-bar">
            <span id="status-text">Ready</span>
            <span id="cursor-position"></span>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="js/shapes.js"></script>
    <script src="js/dragHandler.js"></script>
    <script src="js/fileHandler.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
